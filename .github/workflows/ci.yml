name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pixelguessr
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: pixelguessr
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pixelguessr"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DEBUG: "True"
      DJANGO_SECRET_KEY: dev-ci-only-no-production-secrets
      DATABASE_URL: postgresql://pixelguessr:ci-only-password@localhost:5432/pixelguessr
      TEST_DATABASE_URL: postgresql://pixelguessr:ci-only-password@localhost:5432/pixelguessr
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: "backend/requirements*.txt" }
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: pytest -q
      - name: Validate Compose configuration
        working-directory: .
        run: cp .env.example .env && docker compose config --quiet
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-fund --no-audit
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
